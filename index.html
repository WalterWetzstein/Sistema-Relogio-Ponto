<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Ponto</title>
</head>
<body>

<h2>Sistema de Cálculo de Ponto</h2>

<input type="file" id="arquivo"><br><br>

Valor por hora: <input type="number" id="valorHora" value="10"><br><br>

<button onclick="calcular()">Calcular</button>

<h3 id="resultado"></h3>

<script>
function calcular() {
    const file = document.getElementById("arquivo").files[0];
    const valorHora = parseFloat(document.getElementById("valorHora").value);

    if (!file) {
        alert("Escolha um arquivo CSV");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        const texto = e.target.result;
        const linhas = texto.split("\n");

        let totalHoras = 0;

        for (let i = 1; i < linhas.length; i++) {
            const colunas = linhas[i].split(",");

            let entrada = new Date("1970-01-01 " + colunas[2]);
            let saida = new Date("1970-01-01 " + colunas[3]);

            let horas = (saida - entrada) / (1000 * 60 * 60);

            if (horas < 0) horas += 24;

            totalHoras += horas;
        }

        let total = totalHoras * valorHora;

        document.getElementById("resultado").innerText =
            "Horas: " + totalHoras.toFixed(2) +
            " | Total: R$ " + total.toFixed(2);
    };

    reader.readAsText(file);
}
</script>

</body>
</html>
